name: 📧 واجهة إرسال البريد
on:
  workflow_dispatch:
    inputs:
      to_email:
        description: "✉ البريد المستلم"
        required: true
        type: string
      subject:
        description: "📝 الموضوع"
        required: true
        type: string
      message:
        description: "💬 نص الرسالة"
        required: true
        type: string

jobs:
  send-email-and-update:
    name: إرسال وتحديث الصفحة
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 استلام الملفات
        uses: actions/checkout@v4

      # إنشاء واجهة HTML ديناميكية
      - name: 🌐 إنشاء صفحة الويب
        run: |
          cat > email-sender.html << 'HTMLEND'
  <!DOCTYPE html>
  <html lang="ar" dir="rtl">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>📧 إرسال بريد إلكتروني</title>
      <style>
          * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
          body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
          .card { background: white; border-radius: 20px; padding: 35px; width: 100%; max-width: 520px; box-shadow: 0 15px 40px rgba(0,0,0,0.15); }
          h1 { text-align: center; color: #667eea; margin-bottom: 25px; font-size: 1.7rem; }
          .info { background: #f0f4ff; border-right: 4px solid #667eea; padding: 15px; border-radius: 10px; margin-bottom: 20px; line-height: 1.7; }
          .field { margin-bottom: 15px; }
          label { display: block; margin-bottom: 6px; font-weight: 500; color: #333; }
          input, textarea { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 0.95rem; }
          input:focus, textarea:focus { outline: none; border-color: #667eea; }
          button { width: 100%; padding: 13px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 5px; }
          button:hover { opacity: 0.95; }
          .status { margin-top: 20px; padding: 15px; border-radius: 8px; display: none; text-align: center; font-weight: 500; }
          .success { background: #d4edda; color: #155724; display: block; }
          .pending { background: #fff3cd; color: #856404; display: block; }
          .tip { margin-top: 15px; font-size: 0.85rem; color: #666; text-align: center; line-height: 1.6; }
      </style>
  </head>
  <body>
      <div class="card">
          <h1>📧 إرسال بريد إلكتروني</h1>
          
          <div class="info">
              <strong>💡 طريقة الاستخدام:</strong><br>
              1. اذهب إلى قسم <strong>Actions</strong> في مشروعك<br>
              2. اختر العملية: <strong>📧 واجهة إرسال البريد</strong><br>
              3. اضغط <strong>Run workflow</strong> واملأ البيانات<br>
              4. اضغط تشغيل — وسيتم الإرسال تلقائيًا ✅
          </div>

          <div class="field">
              <label>✉ البريد المستلم:</label>
              <input type="email" id="to" placeholder="example@email.com" readonly>
          </div>
          <div class="field">
              <label>📝 الموضوع:</label>
              <input type="text" id="subject" placeholder="الموضوع..." readonly>
          </div>
          <div class="field">
              <label>💬 الرسالة:</label>
              <textarea id="msg" rows="4" placeholder="نص الرسالة..." readonly></textarea>
          </div>

          <div class="status pending" id="st">⏳ املأ البيانات من صفحة Actions ثم اضغط تشغيل</div>
          
          <div class="tip">
              يتم الإرسال عبر GitHub Actions تلقائيًا<br>
              تأكد من إعداد بيانات البريد في قسم Secrets أولاً 🔑
          </div>
      </div>
  </body>
  </html>
HTMLEND

      # عرض البيانات المدخلة
      - name: 📋 بيانات الرسالة
        run: |
          echo "=================================="
          echo "✉ إلى: ${{ inputs.to_email }}"
          echo "📝 الموضوع: ${{ inputs.subject }}"
          echo "💬 الرسالة: ${{ inputs.message }}"
          echo "=================================="

      # تحديث الصفحة بالبيانات المرسلة
      - name: 🌐 تحديث صفحة الويب
        if: always()
        run: |
          TIMENOW=$(date '+%Y-%m-%d %H:%M:%S')
          cat > last-result.html << EOF
  <!DOCTYPE html>
  <html lang="ar" dir="rtl">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>📧 نتيجة الإرسال</title>
      <style>
          * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
          body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
          .card { background: white; border-radius: 20px; padding: 35px; width: 100%; max-width: 500px; box-shadow: 0 15px 40px rgba(0,0,0,0.15); }
          h1 { text-align: center; color: #667eea; margin-bottom: 25px; }
          .ok { background: #d4edda; color: #155724; padding: 15px; border-radius: 10px; text-align: center; font-size: 1.1rem; margin-bottom: 20px; }
          .data { background: #f8f9fa; padding: 18px; border-radius: 10px; line-height: 1.8; }
          .data div { margin-bottom: 8px; }
          strong { color: #333; }
      </style>
  </head>
  <body>
      <div class="card">
          <h1>📧 نتيجة الإرسال</h1>
          <div class="ok">✅ تم تنفيذ الطلب بنجاح!</div>
          <div class="data">
              <div><strong>⏰ الوقت:</strong> $TIMENOW</div>
              <div><strong>✉ إلى:</strong> ${{ inputs.to_email }}</div>
              <div><strong>📝 الموضوع:</strong> ${{ inputs.subject }}</div>
              <div><strong>💬 الرسالة:</strong> ${{ inputs.message }}</div>
          </div>
      </div>
  </body>
  </html>
EOF

      # إرسال البريد الإلكتروني
      - name: 📧 إرسال الرسالة
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: ${{ inputs.subject }}
          body: |
            تم استلام رسالتك من واجهة البريد 📧
            
            ⏰ الوقت: $(date '+%Y-%m-%d %H:%M:%S')
            ✉ المرسل إليه: ${{ inputs.to_email }}
            📝 الموضوع: ${{ inputs.subject }}
            
            ───────────────
            ${{ inputs.message }}
            ───────────────
            
            تحياتنا،
            نظام الإشعارات التلقائي 🚀
          to: ${{ inputs.to_email }}
          from: GitHub Actions

      # حفظ وتحديث الملفات في المستودع
      - name: 💾 حفظ التحديثات
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add email-sender.html last-result.html
          git commit -m "📧 تحديث صفحة البريد - $(date '+%Y-%m-%d %H:%M')" || true
          git push || true
